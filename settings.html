<div class="inline-drawer">
 <div class="inline-drawer-toggle inline-drawer-header"><b>SharedNAI 연결</b><div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div></div>
 <div class="inline-drawer-content">
  <label class="checkbox_label"><input id="snb-enabled" type="checkbox">NovelAI / AutoPic 생성을 sharednai5.pro로 연결</label>
  <p>사이트 계정에 등록된 키를 사용합니다. API 키를 NovelAI 키 입력란에 넣지 마세요.</p>
  <label>사이트 아이디<input id="snb-username" class="text_pole" autocomplete="off"></label>
  <label>사이트 비밀번호<input id="snb-password" class="text_pole" type="password" autocomplete="off"></label>
  <div class="flex-container"><button id="snb-connect" class="menu_button">연결</button><button id="snb-check" class="menu_button">인증 확인</button><button id="snb-disconnect" class="menu_button">연결 해제</button></div>
  <p>비밀번호는 저장하지 않습니다. 서버 재시작 또는 사이트 토큰 만료 후 다시 연결하세요.</p>
  <p id="snb-status" role="status" aria-live="polite"></p>
  <hr><b>직접 이미지 생성</b>
  <label>모델<select id="snb-model" class="text_pole"><option value="nai-diffusion-4-5-full">V4.5 Full</option><option value="nai-diffusion-4-5-curated">V4.5 Curated</option><option value="nai-diffusion-4-full">V4 Full</option><option value="nai-diffusion-4-curated">V4 Curated</option><option value="nai-diffusion-3">V3</option><option value="nai-diffusion-furry-3">V3 Furry</option><option value="nai-diffusion-5-full">V5 Full</option><option value="nai-diffusion-5-curated">V5 Curated</option></select></label>
  <label>크기<select id="snb-size" class="text_pole"><option>832x1216</option><option>1024x1024</option><option>1216x832</option></select></label>
  <label>프롬프트<textarea id="snb-prompt" class="text_pole" rows="3" placeholder="1girl, garden, sunlight"></textarea></label>
  <label>네거티브 프롬프트<textarea id="snb-negative" class="text_pole" rows="2"></textarea></label>
  <button id="snb-generate" class="menu_button">이미지 생성 (계정 사용량 차감 가능)</button>
  <img id="snb-preview" hidden alt="생성 결과" style="max-width:100%;height:auto">
  <a id="snb-download" hidden target="_blank" rel="noopener">저장된 이미지 열기</a>
 </div>
</div>
